services:
  frontend:
    # Khi deploy: image được pull từ ghcr.io (CI/CD push sẵn)
    # Khi dev local: chạy `docker compose build` trước
    image: ${FRONTEND_IMAGE:-special-education-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: special-education-frontend
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    image: ${BACKEND_IMAGE:-special-education-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: special-education-backend
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/special_education}
      - DIRECT_URL=${DIRECT_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/special_education}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:17-alpine
    container_name: special-education-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong file .env cạnh docker-compose.yml}
      - POSTGRES_DB=special_education
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d special_education"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
