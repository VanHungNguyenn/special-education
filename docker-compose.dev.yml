name: special-education-dev
# Dev mode: code is mounted from ./frontend and ./backend, so saving a file reloads the page or restarts the API.
# Run: ./docker.sh dev
services:
  frontend:
    image: node:22-alpine
    container_name: special-education-frontend-dev
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev -H 0.0.0.0 --webpack"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules/.next: host binaries (glibc) don't run on alpine (musl).
      - /app/node_modules
      - /app/.next
    environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      # File change events don't always cross the Docker Desktop VM; polling makes reload reliable.
      - WATCHPACK_POLLING=true
      - BACKEND_URL=http://backend:4000
    depends_on:
      - backend

  backend:
    image: node:22-alpine
    container_name: special-education-backend-dev
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm db:deploy && pnpm start:dev"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/special_education
      - DIRECT_URL=postgresql://postgres:postgres@db:5432/special_education
      - TSC_WATCHFILE=DynamicPriorityPolling
      - TSC_WATCHDIRECTORY=DynamicPriorityPolling
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: special-education-db-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=special_education
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d special_education"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
